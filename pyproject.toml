[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-streak-cli"
version = "0.1.0"
description = "TikTok Streak CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "playwright>=1.50",
    "tzdata>=2024.1",
    "windows-toasts>=1.3.0",
]

[project.scripts]
streak-saver = "main:app"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
src = ""
